[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ensemble-sensitivity"
version = "0.1.0"
description = "Find the hotspot (high variability) in forecast ensemble to exhibit the area to look at."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "polars>=1.44.2",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "hatchling>=1.32.0",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ensemble_sensitivity"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
# Very aggressive: enable every Ruff rule.
select = ["ALL"]

# These two rules conflict with Ruff's formatter.
# Ruff explicitly recommends disabling them when using `ruff format`.
ignore = [
    "missing-trailing-comma",
    "single-line-implicit-string-concatenation",
]

# Make Ruff enforce annotations as well.
# ANN is already included by ALL, but keeping this section explicit
# documents the intent of the project.
preview = true

[tool.ruff.lint.per-file-ignores]
# Tests can reasonably contain things that would be undesirable in
# production code.
"tests/**/*.py" = [
    "assert",      # assert
    "magic-value-comparison",   # magic values
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-format = true

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.14"

# The important one.
strict = true

# Additional checks beyond the normal strict preset.
warn_unreachable = true
warn_unused_configs = true
extra_checks = true

# Make the intent explicit even though most are already implied by strict.
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_defs = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true

no_implicit_optional = true
warn_return_any = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

strict_equality = true
strict_bytes = true

# Require explicit overrides when overriding methods.
enable_error_code = [
    "explicit-override",
    "deprecated",
]

# Don't silently accept missing third-party stubs.
ignore_missing_imports = false

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-config",
    "--strict-markers",
    "-ra",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@overload",
    "raise NotImplementedError",
]
fail_under = 90
show_missing = true
skip_covered = true
