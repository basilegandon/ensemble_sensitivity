[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ensemble-sensitivity"
version = "0.1.0"
description = "Find the hotspot (high variability) in forecast ensemble to exhibit the area to look at."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cartopy>=0.26.0",
    "defusedxml>=0.7.1",
    "eccodes>=2.41",
    "matplotlib>=3.10",
    "numpy>=2.3",
    "polars>=1.44.2",
    "tqdm>=4.70.1",
]

[project.scripts]
ensemble-sensitivity = "ensemble_sensitivity.main:main"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "hatchling>=1.32.0",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
    "types-defusedxml>=0.7.0.20250822",
    "types-tqdm>=4.67.0.20250809",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ensemble_sensitivity"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
# Very aggressive: enable every Ruff rule.
select = ["ALL"]

# These two rules conflict with Ruff's formatter.
# Ruff explicitly recommends disabling them when using `ruff format`.
ignore = [
    "missing-trailing-comma",
    "single-line-implicit-string-concatenation",
]

# Make Ruff enforce annotations as well.
# ANN is already included by ALL, but keeping this section explicit
# documents the intent of the project.
preview = true

[tool.ruff.lint.per-file-ignores]
# Tests can reasonably contain things that would be undesirable in
# production code.
"tests/**/*.py" = [
    "assert",      # assert
    "magic-value-comparison",   # magic values
    "undocumented-public-function", # test names and assertions describe test behavior
    "docstring-missing-returns",
    "unnecessary-return-none",
    "suspicious-xml-etree-import", # XML fixtures are authored by these tests
    "suspicious-xml-element-tree-usage",
]
"tests/test_data_pipeline.py" = [
    "float-equality-comparison",
    "private-member-access",
    "suspicious-url-open-usage", # verify URL guards reject untrusted endpoints before opening
    "undocumented-magic-method",
    "undocumented-public-init",
    "undocumented-public-method",
]
"tests/test_pearp_wcs_pilot.py" = [
    "private-member-access", # exercise retry and response-validation helpers directly
]
"tests/test_pearp_api_probe.py" = [
    "private-member-access", # exercise small response-parsing helpers directly
]
# This standalone probe uses the standard-library XML parser for the small,
# authenticated Météo-France response and a fixed HTTPS API host.
"docs/pearp_data/probe_pe_arpege_api.py" = [
    "implicit-namespace-package",
    "suspicious-url-open-usage",
    "suspicious-xml-etree-import",
    "suspicious-xml-element-tree-usage",
]
# The pilot uses the same fixed HTTPS host and small XML capabilities document;
# its explicit diagnostics and optional ecCodes binding are exploration-only.
"docs/pearp_data/pilot_pearp_wcs.py" = [
    "error-instead-of-exception",
    "f-string-in-exception",
    "raw-string-in-exception",
    "raise-vanilla-args",
    "suspicious-url-open-usage",
    "suspicious-xml-etree-import",
    "suspicious-xml-element-tree-usage",
]
# The retrieval path pins every request to the configured HTTPS host and uses
# contextual errors for remote-data validation failures.
"src/ensemble_sensitivity/wcs_retrieval.py" = [
    "error-instead-of-exception",
    "f-string-in-exception",
    "raw-string-in-exception",
    "raise-vanilla-args",
    "suspicious-url-open-usage",
]
# Visualization errors include the selected manifest/field context.
"src/ensemble_sensitivity/visualization.py" = [
    "error-instead-of-exception",
    "f-string-in-exception",
    "raw-string-in-exception",
    "raise-vanilla-args",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-format = true

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.14"

# The important one.
strict = true

# Additional checks beyond the normal strict preset.
warn_unreachable = true
warn_unused_configs = true
extra_checks = true

# Make the intent explicit even though most are already implied by strict.
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_defs = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true

no_implicit_optional = true
warn_return_any = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

strict_equality = true
strict_bytes = true

# Require explicit overrides when overriding methods.
enable_error_code = [
    "explicit-override",
    "deprecated",
]

# Don't silently accept missing third-party stubs.
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["cartopy.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-config",
    "--strict-markers",
    "-ra",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------

[tool.coverage.run]
branch = true
source = ["src", "docs"]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@overload",
    "raise NotImplementedError",
]
fail_under = 90
show_missing = true
skip_covered = true
