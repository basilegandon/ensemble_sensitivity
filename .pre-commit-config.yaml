default_install_hook_types:
  - pre-commit
  - post-checkout

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: ty-check
        name: ty check
        entry: uv run --locked --no-sync --no-build ty check .
        language: system
        pass_filenames: false

      - id: push-new-branches
        name: Push new branches to origin
        entry: uv run --locked --no-sync --no-build python scripts/push_new_branch.py
        language: system
        stages: [post-checkout]
        always_run: true
        pass_filenames: false

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-r", "src"]
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
